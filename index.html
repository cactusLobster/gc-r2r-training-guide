<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rim-to-Rim Training 2026</title>
<style>
  :root { --green:#2d6a4f; --dark:#1b4332; --bg:#fafaf8; --card:#fff; --text:#1a1a1a; --muted:#666; --accent:#d4a373; --blue:#1565c0; --red:#c62828; --purple:#7b1fa2; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--text); line-height:1.55; padding-bottom:4rem; }
  header { background:linear-gradient(135deg,var(--green),var(--dark)); color:white; padding:1.15rem 1rem 0.7rem; text-align:center; }
  header h1 { font-size:1.35rem; margin-bottom:0.1rem; }
  header .sub { opacity:0.85; font-size:0.85rem; }
  .progress-bar { height:4px; background:rgba(255,255,255,.22); border-radius:2px; margin:.55rem 1rem 0; overflow:hidden; }
  .progress-bar .fill { height:100%; background:var(--accent); border-radius:2px; }
  .date-strip { background:linear-gradient(135deg,#1b4332,#0d2818); padding:.6rem 0 .8rem; overflow:hidden; }
  .date-strip-inner { display:flex; overflow-x:auto; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; padding:0 1rem; gap:.4rem; scrollbar-width:none; }
  .date-strip-inner::-webkit-scrollbar { display:none; }
  .date-chip { flex-shrink:0; scroll-snap-align:center; width:52px; padding:.4rem .2rem; border-radius:12px; text-align:center; cursor:pointer; transition:all .2s; color:rgba(255,255,255,.62); border:1.5px solid transparent; }
  .date-chip:hover { background:rgba(255,255,255,.1); }
  .date-chip.active { background:white; color:var(--green); border-color:white; }
  .date-chip.today:not(.active) { border-color:var(--accent); color:white; }
  .date-chip .day-name { font-size:.65rem; text-transform:uppercase; letter-spacing:.5px; }
  .date-chip .day-num { font-size:1.1rem; font-weight:800; line-height:1.2; }
  .date-chip .month { font-size:.6rem; opacity:.82; }
  .workout-dot { width:6px; height:6px; border-radius:50%; margin:2px auto 0; }
  .dot-strength{background:#4caf50}.dot-aerobic{background:#2196f3}.dot-hill{background:#ff9800}.dot-hike{background:#f44336}.dot-rest{background:rgba(255,255,255,.32)}.dot-taper{background:#9c27b0}.dot-trip{background:#ffd54f}
  .week-separator { flex-shrink:0; width:1px; background:rgba(255,255,255,.15); margin:.3rem .2rem; align-self:stretch; }
  .info-bar { display:flex; justify-content:center; gap:.5rem; padding:.55rem 1rem; background:white; border-bottom:1px solid #e8e8e8; flex-wrap:wrap; }
  .info-badge { display:inline-block; padding:.2rem .6rem; border-radius:12px; font-size:.78rem; font-weight:700; }
  .info-week{background:var(--accent);color:white}.info-load{background:#e8f5e9;color:var(--green)}.info-type{background:#e3f2fd;color:#1565c0}
  section { padding:.8rem 1rem; max-width:720px; margin:0 auto; }
  h2 { color:var(--green); font-size:1.12rem; margin:1.15rem 0 .45rem; padding-bottom:.25rem; border-bottom:2px solid var(--green); }
  h3 { font-size:1rem; margin:.7rem 0 .3rem; }
  .exercise { background:var(--card); border-radius:12px; padding:.9rem; margin:.5rem 0; box-shadow:0 1px 4px rgba(0,0,0,.08); border-left:4px solid var(--green); }
  .exercise h4 { font-size:.96rem; margin-bottom:.15rem; }
  .sets { color:var(--green); font-weight:700; font-size:.88rem; }
  .cues { font-size:.85rem; color:var(--muted); margin-top:.25rem; }
  .cues li { margin:.1rem 0 .1rem 1.2rem; }
  .video-link { display:inline-flex; align-items:center; gap:.3rem; background:#ff0000; color:white; padding:.2rem .55rem; border-radius:6px; text-decoration:none; font-size:.75rem; font-weight:600; margin-top:.35rem; }
  .tip { background:#fff3cd; border-radius:8px; padding:.62rem; margin:.55rem 0; font-size:.85rem; }
  .tip::before { content:'💡 '; }
  .warn { background:#ffebee; color:#8a1f1f; border-left:4px solid #c62828; border-radius:10px; padding:.7rem; margin:.6rem 0; font-size:.86rem; }
  .card { background:white; border-radius:14px; padding:1rem; margin:.7rem 0; box-shadow:0 1px 4px rgba(0,0,0,.06); }
  .rest-card,.taper-card,.trip-card { border-radius:16px; padding:1.6rem; text-align:center; margin:1.3rem 0; }
  .rest-card { background:linear-gradient(135deg,#e8f5e9,#c8e6c9); }
  .taper-card { background:linear-gradient(135deg,#e0f2f1,#b2dfdb); }
  .trip-card { background:linear-gradient(135deg,#fff3e0,#ffe0b2); }
  .today-btn { display:block; margin:.8rem auto; background:var(--green); color:white; border:none; padding:.62rem 1.5rem; border-radius:10px; font-size:.9rem; font-weight:700; cursor:pointer; }
  table { width:100%; border-collapse:collapse; font-size:.84rem; margin:.4rem 0; }
  td { border-bottom:1px solid #eee; padding:.35rem .2rem; vertical-align:top; }

  .dashboard { background:white; border-radius:16px; padding:1rem; margin:.8rem 0; box-shadow:0 1px 5px rgba(0,0,0,.08); }
  .metric-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:.5rem; margin:.65rem 0; }
  .metric { background:#f6f7f5; border-radius:12px; padding:.65rem; }
  .metric .num { font-size:1.15rem; font-weight:850; color:var(--green); }
  .metric .lbl { font-size:.72rem; color:var(--muted); text-transform:uppercase; letter-spacing:.35px; }
  .flag { display:inline-block; background:#fff3cd; color:#7a5200; padding:.2rem .48rem; border-radius:999px; font-size:.74rem; font-weight:700; margin:.12rem; }
  .done-row { display:flex; align-items:center; gap:.45rem; margin-top:.55rem; font-size:.82rem; color:var(--muted); }
  .done-row input { width:18px; height:18px; accent-color:var(--green); }

  .bottom-nav { position:fixed; bottom:0; left:0; right:0; background:white; border-top:1px solid #e0e0e0; display:flex; justify-content:center; z-index:50; padding-bottom:env(safe-area-inset-bottom); }
  .bottom-nav .nav-inner { display:flex; width:100%; max-width:720px; }
  .bottom-nav button { flex:1; padding:.6rem 0 .75rem; background:none; border:none; border-top:3px solid transparent; font-size:.82rem; font-weight:700; color:var(--muted); cursor:pointer; font-family:inherit; }
  .bottom-nav button.active { color:var(--green); border-top-color:var(--green); }
  .eyebrow { font-size:.72rem; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); font-weight:700; }
  .meal-tabs { display:flex; gap:.4rem; margin:.55rem 0; }
  .meal-tabs button { flex:1; padding:.55rem 0; border-radius:8px; border:1px solid #ddd; background:white; font-weight:800; font-size:1rem; cursor:pointer; color:var(--text); font-family:inherit; }
  .meal-tabs button.active { background:var(--green); color:white; border-color:var(--green); }
  .meal-row { padding:.55rem 0; }
  .meal-row + .meal-row { border-top:1px solid #eee; }
  .meal-row .meal-head { display:flex; justify-content:space-between; align-items:baseline; gap:.5rem; }
  .meal-row .meal-time { font-size:.75rem; color:var(--blue); font-weight:700; white-space:nowrap; }
  .meal-row .meal-items { font-size:.86rem; margin:.15rem 0; }
  .meal-row .meal-mac { font-size:.74rem; color:var(--muted); }
  .meal-total { font-size:.78rem; font-weight:700; color:var(--green); border-top:2px solid var(--green); padding-top:.45rem; margin-top:.3rem; }
  .gro-item { display:flex; gap:.6rem; align-items:flex-start; padding:.32rem 0; font-size:.9rem; cursor:pointer; }
  .gro-item input { width:18px; height:18px; accent-color:var(--green); margin-top:1px; flex-shrink:0; }
  .gro-item.checked { opacity:.45; text-decoration:line-through; }
  .clear-btn { font-size:.72rem; color:var(--muted); background:none; border:1px solid #ddd; border-radius:7px; padding:.3rem .6rem; cursor:pointer; font-family:inherit; margin-bottom:.35rem; }
  .field-row { display:flex; gap:.5rem; margin-bottom:.55rem; }
  .field-lbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); font-weight:700; margin-bottom:2px; }
  .field-row input { width:100%; box-sizing:border-box; padding:.5rem .55rem; font-size:16px; border:1px solid #ddd; border-radius:8px; font-family:inherit; }
  .notes-area { width:100%; box-sizing:border-box; min-height:60px; padding:.5rem .55rem; font-size:16px; border:1px solid #ddd; border-radius:8px; font-family:inherit; resize:vertical; }
  .save-btn { width:100%; margin-top:.55rem; background:var(--green); color:white; border:none; border-radius:9px; padding:.7rem; font-size:1rem; font-weight:800; cursor:pointer; font-family:inherit; }
  .lift-row { display:flex; align-items:center; gap:.55rem; margin-top:.45rem; flex-wrap:wrap; }
  .lift-input { width:130px; padding:.4rem .5rem; font-size:16px; border:1px solid #ddd; border-radius:7px; font-family:inherit; }
  .lift-prev { font-size:.78rem; color:var(--blue); font-weight:700; }
  .heat-rule { background:#fff3e0; color:#7a4a00; border-left:4px solid #ff9800; border-radius:10px; padding:.7rem; margin:.6rem 0; font-size:.86rem; }
  .rower-rule { font-size:.8rem; color:var(--red); font-weight:600; margin:.4rem 0 .1rem; }

  @media(max-width:500px){ section{padding:.65rem .8rem;} .metric-grid{grid-template-columns:1fr 1fr;} }
</style>
</head>

function dateStr(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${dd}`;}
function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}
function parseDate(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}

function add(date,type,extra={}){S[date]={type,...extra};}

for(let wk=1;wk<=12;wk++){
  const start=addDays(parseDate(START),(wk-1)*7);
  for(let i=0;i<7;i++) add(dateStr(addDays(start,i)),pattern[i],{week:wk});
}

1:'Start easy. Build rhythm, no soreness contest.',2:'Add gentle volume and pack familiarity.',3:'First real hiking-leg week.',4:'Consolidate. Let tissues catch up.',5:'Build sustained output.',6:'Add vertical and downhill control.',7:'First back-to-back stimulus.',8:'Recovery/consolidation.',9:'Canyon-specific durability.',10:'Peak vertical week.',11:'Peak back-to-back weekend.',12:'Taper begins: keep sharp, shed fatigue.',13:'Trip week: arrive rested.'

function doneKey(date,name){return `done:${date}:${name}`;}
function isDone(date,name){return localStorage.getItem(doneKey(date,name))==='1';}
function toggleDone(date,name,el){localStorage.setItem(doneKey(date,name),el.checked?'1':'0');}
function toggleDoneEncoded(date,encoded,el){toggleDone(date,decodeURIComponent(encoded),el);}
function liftsData(){try{return JSON.parse(localStorage.getItem('lifts')||'{}');}catch(e){return {};}}
function saveLift(date,encoded,el){const l=liftsData();const key=date+':'+decodeURIComponent(encoded);const v=el.value.trim();if(v)l[key]=v;else delete l[key];localStorage.setItem('lifts',JSON.stringify(l));}
function renderEx(ex,dateKey=''){
  if(typeof dateKey!=='string'||!dateKey.includes('-')) dateKey='';
  const encoded=encodeURIComponent(ex.n);
  const checkbox=dateKey?`<label class="done-row"><input type="checkbox" ${isDone(dateKey,ex.n)?'checked':''} onchange="toggleDoneEncoded('${dateKey}','${encoded}',this)"> Completed</label>`:'';
  let liftRow='';
  if(dateKey){
    const l=liftsData();

function verdict(checkins) {
  const weeks = Object.keys(checkins).map(Number).sort((a,b)=>a-b);
  if (weeks.length < 2) return null;
  const lastW = weeks[weeks.length-1], prevW = weeks[weeks.length-2];
  const last = checkins[lastW], prev = checkins[prevW];
  const perWk = (parseFloat(last.weight) - parseFloat(prev.weight)) / (lastW - prevW);
  const dWaist = parseFloat(last.waist) - parseFloat(prev.waist);
  if (lastW >= 11) return "Week 11+: no more calorie cuts regardless of the trend — you're in peak/taper territory. Ride current intake to Oct 8, then maintenance.";
  if (weeks.length < 3 && lastW <= 5) return "First weeks of the cut include water/glycogen noise — log it, change nothing yet.";
  if (!isNaN(dWaist) && dWaist < -0.05 && Math.abs(perWk) < 0.4) return "Weight flat but waist shrinking → recomposition. The primary metric is winning. Change nothing.";
  if (perWk > -0.5 && (isNaN(dWaist) || dWaist > -0.1)) return "Losing under 0.5 lb/wk with waist flat → if adherence was ≥90%, pick ONE: cut 100 kcal from carbs/fat, or add 1,500 daily steps. Hold 2 weeks.";
  if (perWk < -1.5 && parseFloat(last.hunger) >= 8) return "Losing over 1.5 lb/wk with hunger 8+ → add 100–150 kcal of carbs around training. Protect the muscle and the long hikes.";
  return "In the -0.75 to -1.25 lb/wk lane → on track. Change nothing, keep stacking weeks.";
}
function lineChart(points,color){
  if(points.length<2)return '';
  const W=320,H=120,P=24;
  const ys=points.map(p=>p.y);
  let min=Math.min(...ys),max=Math.max(...ys);
  if(max-min<1){const mid=(max+min)/2;min=mid-0.5;max=mid+0.5;}
  const X=i=>P+i*(W-2*P)/(points.length-1);
  const Y=v=>H-P-((v-min)/(max-min))*(H-2*P);
  const path=points.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(p.y).toFixed(1)}`).join(' ');
  const dots=points.map((p,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="3.5" fill="${color}"/>`).join('');
  const labels=points.map((p,i)=>`<text x="${X(i).toFixed(1)}" y="${H-6}" font-size="9" text-anchor="middle" fill="#666">${p.x}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block"><path d="${path}" fill="none" stroke="${color}" stroke-width="2.5"/>${dots}${labels}<text x="2" y="${Y(max)+3}" font-size="9" fill="#666">${max.toFixed(1)}</text><text x="2" y="${Y(min)+3}" font-size="9" fill="#666">${min.toFixed(1)}</text></svg>`;
}

function render(){const params=new URLSearchParams(window.location.search);const tab=params.get('tab')||'plan';const date=params.get('date');const view=tab==='food'?renderFood():tab==='store'?renderStore():tab==='track'?renderTrack():(date&&S[date]?renderDay(date):renderHome());document.getElementById('app').innerHTML=view+renderNav(tab);if(tab==='plan')setTimeout(()=>{const strip=document.getElementById('dateStrip');const active=strip&&strip.querySelector('.active,.today');if(active&&strip)active.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});},100);}
window.addEventListener('popstate',render);loadStrava().then(render);
</script>
